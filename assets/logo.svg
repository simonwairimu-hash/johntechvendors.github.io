<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 65" width="100%" height="100%">
  <!-- Left Logo Icon: Gear + JVL Monogram -->
  <g transform="translate(32, 32.5) scale(0.14)">
    <defs>
      <path id="hdr-tooth" d="M -22,-228 L 22,-228 L 28,-190 L -28,-190 Z" fill="#0B2B68" />
    </defs>
    <!-- 18 Gear teeth -->
    <use href="#hdr-tooth" transform="rotate(0)" />
    <use href="#hdr-tooth" transform="rotate(20)" />
    <use href="#hdr-tooth" transform="rotate(40)" />
    <use href="#hdr-tooth" transform="rotate(60)" />
    <use href="#hdr-tooth" transform="rotate(80)" />
    <use href="#hdr-tooth" transform="rotate(100)" />
    <use href="#hdr-tooth" transform="rotate(120)" />
    <use href="#hdr-tooth" transform="rotate(140)" />
    <use href="#hdr-tooth" transform="rotate(160)" />
    <use href="#hdr-tooth" transform="rotate(180)" />
    <use href="#hdr-tooth" transform="rotate(200)" />
    <use href="#hdr-tooth" transform="rotate(220)" />
    <use href="#hdr-tooth" transform="rotate(240)" />
    <use href="#hdr-tooth" transform="rotate(260)" />
    <use href="#hdr-tooth" transform="rotate(280)" />
    <use href="#hdr-tooth" transform="rotate(300)" />
    <use href="#hdr-tooth" transform="rotate(320)" />
    <use href="#hdr-tooth" transform="rotate(340)" />

    <!-- Outer rim -->
    <circle r="195" fill="#0B2B68" />
    <!-- White ring -->
    <circle r="172" fill="#FFFFFF" />
    <!-- Blue border ring -->
    <circle r="162" fill="none" stroke="#0B2B68" stroke-width="8" />
    <!-- Center white disk -->
    <circle r="158" fill="#FFFFFF" />

    <!-- J V L -->
    <path d="M -112,-80 L -78,-80 L -78,35 C -78,65 -92,80 -118,80 C -138,80 -150,68 -154,54 L -124,42 C -124,48 -120,54 -114,54 C -106,54 -102,48 -102,34 L -102,-80 Z" fill="#0B2B68" />
    <polygon points="-40,-80 0,80 40,-80 10,-80 0,45 -10,-80" fill="#E51B24" />
    <polygon points="54,-80 84,-80 84,52 142,52 142,80 54,80" fill="#0B2B68" />
  </g>

  <!-- Typography -->
  <g transform="translate(74, 0)">
    <!-- Company Name -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0A1E42" letter-spacing="-0.02em">
      Johntech <tspan fill="#0A1E42">Vendors</tspan> <tspan fill="#E51B24" font-weight="900">LTD</tspan>
    </text>
    <!-- Tagline -->
    <text x="0" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="7.8" font-weight="600" fill="#5A6D87" letter-spacing="0.14em">
      SMART SOLUTIONS <tspan fill="#E51B24">•</tspan> SUSTAINABLE TOMORROW
    </text>
  </g>
</svg>
