<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Tooth template for gear -->
    <path id="gear-tooth" d="M -22,-228 L 22,-228 L 28,-190 L -28,-190 Z" fill="#0D47A1" />
  </defs>

  <!-- Central Gear Body -->
  <g transform="translate(250, 250)">
    <!-- 18 Gear teeth rotated 20 deg each -->
    <use href="#gear-tooth" transform="rotate(0)" />
    <use href="#gear-tooth" transform="rotate(20)" />
    <use href="#gear-tooth" transform="rotate(40)" />
    <use href="#gear-tooth" transform="rotate(60)" />
    <use href="#gear-tooth" transform="rotate(80)" />
    <use href="#gear-tooth" transform="rotate(100)" />
    <use href="#gear-tooth" transform="rotate(120)" />
    <use href="#gear-tooth" transform="rotate(140)" />
    <use href="#gear-tooth" transform="rotate(160)" />
    <use href="#gear-tooth" transform="rotate(180)" />
    <use href="#gear-tooth" transform="rotate(200)" />
    <use href="#gear-tooth" transform="rotate(220)" />
    <use href="#gear-tooth" transform="rotate(240)" />
    <use href="#gear-tooth" transform="rotate(260)" />
    <use href="#gear-tooth" transform="rotate(280)" />
    <use href="#gear-tooth" transform="rotate(300)" />
    <use href="#gear-tooth" transform="rotate(320)" />
    <use href="#gear-tooth" transform="rotate(340)" />

    <!-- Outer solid blue circle connecting teeth -->
    <circle r="195" fill="#0D47A1" />

    <!-- White ring -->
    <circle r="172" fill="#FFFFFF" />

    <!-- Blue border ring -->
    <circle r="162" fill="none" stroke="#0D47A1" stroke-width="8" />

    <!-- Center white disk -->
    <circle r="158" fill="#FFFFFF" />

    <!-- Monogram: J V L -->
    <!-- J (Blue) -->
    <path d="M -112,-80 L -78,-80 L -78,35 C -78,65 -92,80 -118,80 C -138,80 -150,68 -154,54 L -124,42 C -124,48 -120,54 -114,54 C -106,54 -102,48 -102,34 L -102,-80 Z" fill="#0D47A1" />

    <!-- V (Vibrant Red) -->
    <polygon points="-40,-80 0,80 40,-80 10,-80 0,45 -10,-80" fill="#E51B24" />

    <!-- L (Blue) -->
    <polygon points="54,-80 84,-80 84,52 142,52 142,80 54,80" fill="#0D47A1" />
  </g>
</svg>
